<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股觀察室｜投資日誌</title>
<style>
:root{--bg:#f6f5f0;--ink:#243831;--muted:#79827a;--line:#e2e5dc;--green:#285a47;--light:#eaf0e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:8px 14px;border-radius:8px}button:hover{background:var(--light)}button:focus-visible,a:focus-visible{outline:3px solid #c29652;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#194735}.quiet{background:transparent}.danger{color:#a94e41}header{padding:25px 36px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:20px}.brand{font-size:22px;font-weight:750;letter-spacing:2px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:32px 36px 25px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:30px;letter-spacing:1px;margin:0 0 6px}p{margin:0;color:var(--muted)}.stats{display:flex;gap:32px;white-space:nowrap}.stats strong{font:32px Georgia,serif;display:block}.stats span{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:210px 290px minmax(0,1fr);border-top:1px solid var(--line);min-height:65vh}aside{padding:24px 20px;border-right:1px solid var(--line)}.label{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:18px}.sector{width:100%;display:flex;justify-content:space-between;margin-bottom:6px;background:transparent;border-color:transparent;text-align:left}.sector.active{background:var(--green);color:white}.sector span{opacity:.65}.side-bottom{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.stock-panel{padding:24px 16px;border-right:1px solid var(--line)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;background:white;padding:10px;color:var(--ink)}input:focus,textarea:focus,select:focus{outline:2px solid #9eb4a5}#search{margin-bottom:18px;background:#eeefe9}.stock{display:block;text-align:left;width:100%;margin:0 0 10px;padding:16px;background:transparent}.stock.active{background:white;border-color:#9ab5a1;box-shadow:0 3px 14px #213b3208}.stock b{font-size:17px}.stock small{display:block;color:var(--muted);margin-top:8px}.code{font-size:12px;color:var(--muted);margin-left:8px}.pill{font-size:11px;background:var(--light);color:var(--green);padding:3px 8px;border-radius:4px;display:inline-block}.detail{padding:28px 32px}.detail-top{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:24px}h2{font-size:25px;margin:6px 0}h3{font-size:17px;margin:5px 0 12px}.note{background:white;border:1px solid var(--line);border-radius:10px;padding:23px;margin:0 0 18px;position:relative}.note-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.date{font-size:12px;color:var(--muted)}.body{white-space:pre-wrap;overflow-wrap:anywhere}.follow{margin-top:17px;border-left:3px solid #b9c8a9;padding:8px 12px;background:#f7f8f3}.follow small{display:block;color:var(--muted)}a{color:var(--green);overflow-wrap:anywhere}.note footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}.note footer button{font-size:12px;padding:4px 9px}.empty{text-align:center;padding:65px 18px;border:1px dashed #cdd5c9;border-radius:10px}.empty .symbol{font:44px Georgia,serif;color:#a9b9a4;margin-bottom:12px}.empty p{margin-bottom:20px;font-size:14px}.storage{padding:15px 36px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}#status{color:var(--green);margin-right:15px}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:600px;width:calc(100% - 32px);max-height:90vh;color:var(--ink);box-shadow:0 25px 90px #172a3433}dialog::backdrop{background:#172a3455;backdrop-filter:blur(3px)}dialog h2{margin:0 0 20px;font-size:23px}label{display:block;margin:13px 0;font-size:13px}label input,label select,label textarea{margin-top:6px}textarea{resize:vertical;min-height:130px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dialog-actions{display:flex;justify-content:end;gap:8px;margin-top:24px}.hint{font-size:12px;color:var(--muted)}.wide{width:100%}@media(min-width:1450px){.workspace,.hero,header,.storage{padding-left:max(36px,calc((100vw - 1500px)/2));padding-right:max(36px,calc((100vw - 1500px)/2))}.workspace{grid-template-columns:210px 310px minmax(0,1fr)}}@media(max-width:1000px){.workspace{grid-template-columns:170px 240px minmax(0,1fr)}.detail{padding:22px 18px}.detail-top{flex-wrap:wrap}header{padding:20px}.hero{padding:26px 20px}}@media(max-width:760px){header,.hero{align-items:start;flex-direction:column}.stats{gap:40px}.stats strong{font-size:25px}.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:18px}.sector{width:auto;display:inline-flex;gap:12px}.side-bottom{margin-top:10px;padding-top:10px}.stock-panel{border-right:0;border-bottom:1px solid var(--line)}#stocks{display:flex;gap:10px;overflow:auto}.stock{min-width:200px}.detail{padding:22px 16px}.storage{padding:16px}.row{grid-template-columns:1fr;gap:0}h1{font-size:26px}}
.sector-row{display:flex;align-items:center;gap:2px}.sector-row .sector{flex:1;min-width:0;margin-bottom:3px}.sector-row .sector-name{opacity:1;overflow-wrap:anywhere}.tree-toggle{flex:0 0 24px;padding:4px 0;border:0;background:transparent}.tree-spacer{flex:0 0 24px}.sector-children{padding-left:14px;border-left:1px solid var(--line);margin-left:12px}@media(max-width:760px){.sector-row .sector{width:100%}.sector-children{padding-left:16px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">TAIWAN EQUITY JOURNAL</div><div class="brand">台股觀察室 <span style="color:#a9b9a4">／</span></div></div><div class="actions"><button id="import">匯入備份</button><button id="backup">備份資料</button><button id="export" class="primary">匯出完整 HTML ↗</button></div></header>
<section class="hero"><div><div class="eyebrow" id="today"></div><h1>把觀察留下，讓判斷有跡可循。</h1><p>從產業趨勢到個股筆記，累積自己的投資脈絡。</p></div><div class="stats" id="stats"></div></section>
<main class="workspace"><aside><div class="label">關注族群 / SECTORS</div><nav id="sectors" aria-label="類股族群"></nav><div class="side-bottom"><button id="add-sector" class="quiet wide">＋ 新增族群</button><button id="add-child" class="quiet wide" hidden>＋ 新增子族群</button><button id="manage-sector" class="quiet wide" hidden>編輯目前族群</button></div></aside><section class="stock-panel"><div class="label">個股清單 / WATCHLIST</div><input id="search" type="search" placeholder="搜尋代號、名稱、心得…" aria-label="搜尋個股與心得"><div id="stocks"></div><button id="add-stock" class="quiet wide">＋ 新增關注個股</button></section><section class="detail" id="detail"></section></main>
<footer class="storage"><span id="status" role="status" aria-live="polite">● 本機日誌</span>資料儲存在此瀏覽器，不會自動寫回原始檔。請定期匯出 HTML 或備份資料；清除瀏覽器資料可能造成紀錄遺失。</footer>
<dialog id="editor"><form id="form"><h2 id="form-title"></h2><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">儲存</button></div></form></dialog>
<input id="file" type="file" accept="application/json,.json" hidden>
<script id="embedded-data" type="application/json">{"version":1,"journalId":"95616c8f-9dfa-4019-a3ae-28b2259f4ae4","revision":0,"sectors":[{"id":"semiconductor","name":"半導體"},{"id":"ai","name":"AI 伺服器"},{"id":"finance","name":"金融"}],"stocks":[],"notes":[]}</script>
<script>
'use strict';
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const taipei=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=t=>p.find(x=>x.type===t).value;return `${v('year')}-${v('month')}-${v('day')}T${v('hour')}:${v('minute')}`};
function valid(d){if(!d||d.version!==1||typeof d.journalId!=='string'||!Number.isFinite(d.revision)||!['sectors','stocks','notes'].every(k=>Array.isArray(d[k])))throw Error('不是支援的日誌備份');for(const k of ['sectors','stocks','notes']){if(new Set(d[k].map(x=>x.id)).size!==d[k].length)throw Error('紀錄編號重複');for(const x of d[k])if(!x||typeof x.id!=='string')throw Error('紀錄格式不完整')}for(const s of d.sectors)if(typeof s.name!=='string'||!s.name.trim())throw Error('族群名稱不完整');validateHierarchy(d.sectors);for(const s of d.stocks)if(!['code','name','sector'].every(k=>typeof s[k]==='string')||!d.sectors.some(g=>g.id===s.sector))throw Error('個股資料不完整');for(const n of d.notes)if(!['stock','date','title','body','stance','follow','source'].every(k=>typeof n[k]==='string')||!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(n.date)||!d.stocks.some(s=>s.id===n.stock)||!['持續觀察','偏多','中性','偏空'].includes(n.stance)||n.source&&!/^https?:\/\//i.test(n.source))throw Error('觀察紀錄格式不完整');return d}
function validateHierarchy(sectors){
 const byId=new Map(sectors.map(g=>[g.id,g]));
 for(const g of sectors){if(g.parent===undefined)g.parent=null;if(g.parent!==null&&(typeof g.parent!=='string'||!byId.has(g.parent)))throw Error('找不到上層族群');const seen=new Set([g.id]);let parent=g.parent;while(parent!==null){if(seen.has(parent))throw Error('族群不能形成循環階層');seen.add(parent);parent=byId.get(parent).parent??null}}
}
const collapsed=new Set();
function sectorWithin(id,ancestor){if(ancestor==='all')return true;let g=data.sectors.find(g=>g.id===id);while(g){if(g.id===ancestor)return true;g=data.sectors.find(x=>x.id===g.parent)}return false}
function sectorPath(id){const names=[];let g=data.sectors.find(g=>g.id===id);while(g){names.unshift(g.name);g=data.sectors.find(x=>x.id===g.parent)}return names.join(' ／ ')}
function orderedSectors(parent=null){return data.sectors.filter(g=>g.parent===parent).flatMap(g=>[g,...orderedSectors(g.id)])}
function revealSector(id){let g=data.sectors.find(g=>g.id===id);while(g){collapsed.delete(g.id);g=data.sectors.find(x=>x.id===g.parent)}}
function sectorTree(parent=null){return data.sectors.filter(g=>g.parent===parent).map(g=>{const children=data.sectors.some(x=>x.parent===g.id),closed=collapsed.has(g.id);return `<div class="sector-row">${children?`<button class="tree-toggle" data-toggle="${esc(g.id)}" aria-label="${closed?'展開':'收合'}${esc(g.name)}" aria-expanded="${!closed}">${closed?'▸':'▾'}</button>`:'<span class="tree-spacer"></span>'}<button class="sector ${g.id===sector?'active':''}" data-sector="${esc(g.id)}"><span class="sector-name">${esc(g.name)}</span><span>${data.stocks.filter(x=>sectorWithin(x.sector,g.id)).length}</span></button></div>${children&&!closed?`<div class="sector-children">${sectorTree(g.id)}</div>`:''}`}).join('')}
let data=valid(JSON.parse($('embedded-data').textContent)),storageKey='tw-investment-journal:'+data.journalId, storageIssue='';
try{const raw=localStorage.getItem(storageKey);if(raw){const cached=valid(JSON.parse(raw));if(cached.revision>=data.revision)data=cached}}catch(e){storageIssue='無法讀取瀏覽器儲存，請使用匯出保存。'}
let sector='all',selected=data.stocks[0]?.id||null,query='',submitEditor;
const notesFor=id=>data.notes.filter(n=>n.stock===id).sort((a,b)=>b.date.localeCompare(a.date));
function save(){data.revision=Math.max(Date.now(),data.revision+1);try{localStorage.setItem(storageKey,JSON.stringify(data));$('status').textContent='● 已儲存於此瀏覽器 · '+taipei().slice(11)}catch(e){$('status').textContent='⚠ 自動儲存失敗，請立即匯出 HTML 保存';}render()}
function render(){
 $('today').textContent=taipei().slice(0,10).replaceAll('-',' / ')+' · 個人投資日誌';$('stats').innerHTML=[[data.sectors.length,'關注族群'],[data.stocks.length,'關注個股'],[data.notes.length,'觀察紀錄']].map(([n,t])=>`<div><strong>${n.toString().padStart(2,'0')}</strong><span>${t}</span></div>`).join('');
 $('sectors').innerHTML=`<button class="sector ${sector==='all'?'active':''}" data-sector="all">全部個股<span>${data.stocks.length}</span></button>`+sectorTree();$('manage-sector').hidden=sector==='all';$('add-child').hidden=sector==='all';
 const stocks=data.stocks.filter(s=>sectorWithin(s.sector,sector)&&(!query||[s.code,s.name,...notesFor(s.id).flatMap(n=>[n.title,n.body,n.follow])].join(' ').toLowerCase().includes(query)));
 if(!stocks.some(s=>s.id===selected))selected=stocks[0]?.id||null;
 $('stocks').innerHTML=stocks.map(s=>{const n=notesFor(s.id);return `<button class="stock ${s.id===selected?'active':''}" data-stock="${esc(s.id)}"><b>${esc(s.name)}</b><span class="code">${esc(s.code)}</span><small>${n.length} 則觀察 ${n.length?'・'+esc(n[0].date.slice(0,10)): '・等待第一筆紀錄'}</small></button>`}).join('')||'<p class="hint" style="padding:12px 0 24px">'+(query?'沒有符合搜尋的個股。':'尚未加入個股，從你的觀察名單開始。')+'</p>';
 const s=data.stocks.find(s=>s.id===selected);if(!s){$('detail').innerHTML='<div class="empty"><div class="symbol">✳</div><h2>你的下一個投資觀察，從這裡開始</h2><p>選擇一個族群，加入個股，再寫下第一筆心得。<br>預設族群可自由編輯；這裡沒有預填的投資建議。</p><button class="primary" data-action="new-stock">＋ 新增關注個股</button></div>';return}
 const notes=notesFor(s.id);$('detail').innerHTML=`<div class="detail-top"><div><span class="pill">${esc(sectorPath(s.sector))}</span><h2>${esc(s.name)} <span class="code">${esc(s.code)}</span></h2><p class="hint">${notes.length} 則觀察 · 時間由新到舊 · 台北時間</p></div><div class="actions"><button data-action="edit-stock">編輯個股</button><button class="primary" data-action="new-note">＋ 寫觀察</button></div></div>`+(notes.length?notes.map(n=>`<article class="note"><div class="note-head"><time class="date">${esc(n.date.replace('T',' · '))}</time><span class="pill">${esc(n.stance)}</span></div><h3>${esc(n.title)}</h3><div class="body">${esc(n.body)}</div>${n.follow?`<div class="follow"><small>後續觀察事項</small><div class="body">${esc(n.follow)}</div></div>`:''}<footer><div>${n.source?`<a href="${esc(n.source)}" target="_blank" rel="noopener noreferrer">參考來源 ↗</a>`:'<span class="hint">個人觀察</span>'}</div><div><button data-edit="${esc(n.id)}">編輯</button> <button class="danger" data-delete="${esc(n.id)}">刪除</button></div></footer></article>`).join(''):'<div class="empty"><div class="symbol">＋</div><h3>留下第一個觀點</h3><p>為什麼開始關注？看到了什麼變化？<br>把當下的判斷留下，日後就能回顧。</p><button data-action="new-note">新增觀察紀錄</button></div>');
}
function openEditor(title,html,fn){$('form-title').textContent=title;$('fields').innerHTML=html;submitEditor=fn;$('editor').showModal()}
function field(label,name,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function stockEditor(edit=false){if(!data.sectors.length){alert('請先新增一個族群。');return}const s=edit?data.stocks.find(s=>s.id===selected):{code:'',name:'',sector:sector==='all'?data.sectors[0].id:sector};openEditor(edit?'編輯關注個股':'新增關注個股',`<div class="row">${field('股票代號','code',s.code,'text',true)}${field('股票名稱','name',s.name,'text',true)}</div><label>所屬族群<select name="sector">${orderedSectors().map(g=>`<option value="${esc(g.id)}" ${g.id===s.sector?'selected':''}>${esc(sectorPath(g.id))}</option>`).join('')}</select></label><p class="hint">自行輸入代號與名稱，不會連線擷取即時股價。</p>${edit?'<button type="button" id="remove-stock" class="danger">刪除此個股與所有紀錄</button>':''}`,v=>{if(!v.code||!v.name)throw Error('請填寫代號與名稱');if(data.stocks.some(x=>x.code===v.code&&x.id!==s.id))throw Error('此股票代號已存在，請直接新增觀察紀錄');if(edit)Object.assign(s,v);else{const item={id:uid(),...v};data.stocks.push(item);selected=item.id}sector=v.sector;revealSector(sector);query='';$('search').value=''});if(edit)$('remove-stock').onclick=()=>{if(confirm('確定刪除此個股及其所有觀察紀錄？此操作無法復原。')){data.stocks=data.stocks.filter(x=>x.id!==s.id);data.notes=data.notes.filter(n=>n.stock!==s.id);$('editor').close();save()}}}
function noteEditor(id){const n=data.notes.find(n=>n.id===id)||{date:taipei(),title:'',body:'',stance:'持續觀察',follow:'',source:''};openEditor(id?'編輯觀察紀錄':'新增觀察紀錄',`<div class="row">${field('觀察時間（Asia/Taipei）','date',n.date,'datetime-local',true)}<label>當時看法<select name="stance">${['持續觀察','偏多','中性','偏空'].map(s=>`<option ${s===n.stance?'selected':''}>${s}</option>`).join('')}</select></label></div>${field('觀察標題','title',n.title,'text',true)}<label>觀察心得<textarea name="body" required placeholder="觀察到什麼？判斷的理由是什麼？有哪些不確定性？">${esc(n.body)}</textarea></label><label>後續觀察事項（選填）<textarea name="follow" style="min-height:75px" placeholder="下次要追蹤的指標、事件或待驗證假設">${esc(n.follow)}</textarea></label>${field('參考來源網址（選填）','source',n.source,'url')}`,v=>{if(!v.title||!v.body)throw Error('請填寫標題與心得');if(v.source&&!/^https?:\/\//i.test(v.source))throw Error('來源請使用 http 或 https 網址');if(id)Object.assign(n,v);else data.notes.push({id:uid(),stock:selected,...v})})}
function sectorEditor(edit=false,parent=null){
 const g=edit?data.sectors.find(g=>g.id===sector):{name:'',parent};
 const choices=orderedSectors().filter(x=>!edit||!sectorWithin(x.id,g.id));
 openEditor(edit?'編輯族群':parent?'新增子族群':'新增關注族群',field('族群名稱','name',g.name,'text',true)+`<label>上層族群<select name="parent"><option value="">無（主族群）</option>${choices.map(x=>`<option value="${esc(x.id)}" ${x.id===g.parent?'selected':''}>${esc(sectorPath(x.id))}</option>`).join('')}</select></label><p class="hint">例如：半導體 ／ IC 設計。選取主族群時會包含旗下子族群的個股。</p>`+(edit?'<button type="button" id="remove-sector" class="danger">刪除此族群</button><p class="hint">需先移走或刪除直接歸屬的個股及子族群。</p>':''),v=>{
 const parent=v.parent||null;if(!v.name)throw Error('請填寫族群名稱');if(parent&&(!data.sectors.some(x=>x.id===parent)||(edit&&sectorWithin(parent,g.id))))throw Error('上層族群無效');
 if(data.sectors.some(x=>x.name===v.name&&x.parent===parent&&x.id!==g.id))throw Error('相同上層已有此名稱的族群');
 if(edit)Object.assign(g,{name:v.name,parent});else{const id=uid();data.sectors.push({id,name:v.name,parent});sector=id}revealSector(sector);
 });
 if(edit)$('remove-sector').onclick=()=>{if(data.stocks.some(s=>s.sector===g.id)||data.sectors.some(x=>x.parent===g.id)){alert('請先移走或刪除這個族群內的個股及子族群。');return}if(confirm('確定刪除此族群？')){data.sectors=data.sectors.filter(x=>x.id!==g.id);sector=g.parent||'all';$('editor').close();save()}}
}

$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,v.trim()]));try{submitEditor(v);$('editor').close();save()}catch(e){alert(e.message)}};$('cancel').onclick=()=>$('editor').close();$('add-sector').onclick=()=>sectorEditor();$('add-child').onclick=()=>sectorEditor(false,sector);$('manage-sector').onclick=()=>sectorEditor(true);$('add-stock').onclick=()=>stockEditor();
$('sectors').onclick=e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){const id=toggle.dataset.toggle;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render();return}const b=e.target.closest('[data-sector]');if(b){sector=b.dataset.sector;render()}};$('stocks').onclick=e=>{const b=e.target.closest('[data-stock]');if(b){selected=b.dataset.stock;render()}};$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
$('detail').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='new-stock')stockEditor();if(b.dataset.action==='edit-stock')stockEditor(true);if(b.dataset.action==='new-note')noteEditor();if(b.dataset.edit)noteEditor(b.dataset.edit);if(b.dataset.delete&&confirm('確定刪除這筆觀察？此操作無法復原。')){data.notes=data.notes.filter(n=>n.id!==b.dataset.delete);save()}};
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('backup').onclick=()=>download(JSON.stringify(data,null,2),'台股觀察室備份-'+taipei().slice(0,10)+'.json','application/json');
$('export').onclick=()=>{const clone=document.documentElement.cloneNode(true);const snapshot=JSON.parse(JSON.stringify(data));snapshot.journalId=uid();clone.querySelector('#embedded-data').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');clone.querySelector('#editor').removeAttribute('open');clone.querySelector('#fields').innerHTML='';clone.querySelector('#search').setAttribute('value','');download('<!DOCTYPE html>\n'+clone.outerHTML,'台股觀察室-'+taipei().slice(0,10)+'.html','text/html;charset=utf-8')};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const next=valid(JSON.parse(await file.text()));if(confirm(`匯入 ${next.stocks.length} 檔個股、${next.notes.length} 筆觀察，取代目前全部資料？建議先備份目前資料。`)){next.journalId=data.journalId;data=next;sector='all';selected=null;query='';$('search').value='';save()}}catch(e){alert('匯入失敗：'+e.message)}finally{$('file').value=''}};
render();if(storageIssue)$('status').textContent=storageIssue;
</script>
</body>
</html>
